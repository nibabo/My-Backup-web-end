<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보관함">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>나의 보관함</title>
<style>
:root{--bg:#fff;--card:#f3f4f6;--text:#0f1419;--sub:#6b7280;--line:#e5e7eb;--accent:#1d9bf0;--danger:#e0245e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d10;--card:#16181c;--text:#e7e9ea;--sub:#8b98a5;--line:#2f3336}}
:root[data-theme="dark"]{--bg:#0b0d10;--card:#16181c;--text:#e7e9ea;--sub:#8b98a5;--line:#2f3336}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
button,label.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:7px 14px;font-weight:700;color:inherit;background:transparent}
.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.5}
.ghost{color:var(--accent)}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:transparent;color:var(--text);font:inherit}
.app{display:block}
.side{position:fixed;left:0;top:0;bottom:0;width:84%;max-width:300px;background:var(--bg);border-right:1px solid var(--line);z-index:30;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body.nav .side{transform:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}body.nav .scrim{display:block}
.side .top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.side .btns{display:flex;gap:6px}.side .btns button{flex:1;background:var(--card);padding:6px 8px;font-size:13px}
#newf{display:none;gap:6px}#newf.on{display:flex}#newf button{white-space:nowrap}
#tree{flex:1;overflow:auto;padding:6px}
.it{display:flex;align-items:center;gap:2px;border-radius:10px}
.it.sel{background:var(--card)}
.it .arr{width:26px;padding:4px 0;color:var(--sub);font-size:12px}
.it .lab{flex:1;text-align:left;display:flex;align-items:center;gap:8px;padding:7px 6px;font-weight:600;font-size:15px;min-width:0;border-radius:10px}
.it .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:22px;height:22px;object-fit:contain;flex:none}.mini.e{font-size:17px;line-height:22px;text-align:center}
.sr{padding:8px;border-radius:10px;cursor:pointer}.sr:hover{background:var(--card)}.sr small{display:block;color:var(--sub);font-size:12px}
.content{position:relative;min-height:100dvh}
.bgl{display:none;position:fixed;top:0;bottom:0;left:0;right:0;background-size:cover;background-position:center;z-index:0}
.bgl::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.6)}
.content>*:not(.bgl){position:relative;z-index:1}
.glass{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#menu{font-size:20px;padding:4px 10px}
.crumb{color:var(--accent);padding:2px 4px;font-size:16px}.crumb.now{color:var(--text);cursor:default}.sep{color:var(--sub)}
.sp{flex:1}
.wrap{max-width:960px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px;padding:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tileBtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border-radius:14px;width:100%}
.mv{display:flex;gap:2px;opacity:.55}
.mv button{background:var(--card);width:22px;height:20px;padding:0;font-size:10px;border-radius:6px}
.mv button:disabled{opacity:.25}
.tile .ico{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:56px;transition:transform .12s}
.tile:active .ico{transform:scale(.92)}
.tile img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.tile .nm{font-size:13px;font-weight:700;text-align:center;word-break:break-word;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
.compose,.post{margin:10px 12px;padding:14px;border:1px solid var(--line);border-radius:16px}
textarea.t{border:0;padding:0;min-height:70px;resize:vertical;font-size:16px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meta{color:var(--sub);font-size:13px}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0}
.imgs{display:grid;gap:6px;grid-template-columns:1fr 1fr;margin-top:8px}.imgs.one{grid-template-columns:1fr}
.vid{width:100%;max-height:440px;border-radius:12px;background:#000;margin-top:8px}
.thumbs video{width:68px;height:68px;object-fit:cover;border-radius:10px}
.imgs img{width:100%;max-height:440px;object-fit:cover;border-radius:12px;background:var(--card)}
.del{color:var(--sub);font-weight:400;font-size:13px;padding:2px 8px}.del.confirm{color:var(--danger);font-weight:700}
.status{padding:16px;color:var(--sub);text-align:center}
.err{color:var(--danger);font-size:13px;min-height:16px}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.box{background:var(--bg);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:18px}.box label.l{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:4px}
.pv{display:flex;align-items:center;gap:10px}.pv img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:repeating-conic-gradient(var(--card) 0 25%,transparent 0 50%) 0 0/16px 16px}
.pv img.wide{width:96px;object-fit:cover}
.btn.up{background:var(--card);padding:6px 12px;font-size:13px}
.foot{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.foot button{width:100%;background:var(--card)}
.th{position:relative;width:76px;height:76px}
.th img,.th video{width:100%;height:100%;object-fit:cover;border-radius:10px}
.th button{position:absolute;top:2px;padding:0;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:24px}
.th .x{right:2px}.th .cut{left:2px}
.cv{background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/16px 16px;border-radius:10px;display:flex;justify-content:center;overflow:hidden}
.cv canvas{max-width:100%;max-height:46dvh;cursor:crosshair}
.sw2{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;border:1px solid var(--line)}
#cutM{z-index:60}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes boxin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.tile.enter{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0)*45ms)}
.post.enter{animation:rise .35s ease both;animation-delay:calc(var(--i,0)*40ms)}
.post.fresh{animation:drop .4s cubic-bezier(.34,1.3,.64,1) both}
.post.out{opacity:0;transform:translateX(24px) scale(.97);transition:all .22s ease}
.it.ti{animation:slidein .25s ease both;animation-delay:calc(var(--i,0)*30ms)}
.bgl.fade{animation:fadein .6s ease}
.modal.on .box{animation:boxin .2s ease}
button:active,label.btn:active{transform:scale(.96)}
.tile:active .ico{transform:scale(.9)!important}
@media (hover:hover){.tile:hover .ico{transform:translateY(-3px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:760px){
 .imgs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.imgs.one{grid-template-columns:minmax(0,640px)}
 .app{display:grid;grid-template-columns:270px 1fr}
 .side{position:sticky;transform:none;width:auto;max-width:none;height:100dvh}
 .bgl{left:270px}
 #menu{display:none}
 body.nav .scrim{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="top">
    <input type="text" id="q" placeholder="🔍 폴더·글 검색">
    <div class="btns"><button id="addF">＋ 폴더</button><button id="bulkB">＋＋ 여러 개</button></div>
    <div id="newf"><input type="text" id="fname" maxlength="60"><button class="primary" id="mkF">만들기</button></div>
  </div>
  <div id="tree"></div>
  <div class="foot"><button id="bkB">💾 백업 · 복원</button></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="content">
  <div class="bgl" id="bgl"></div>
  <header class="glass" id="crumbs"></header>
  <div class="wrap">
    <div class="tiles" id="tiles"></div>
    <div class="compose glass">
      <textarea class="t" id="text" placeholder="이 폴더에 메모나 사진을 남겨요"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="row"><label class="btn ghost" id="photoBtn" style="display:none">📷 사진·영상<input type="file" id="file" accept="image/*,video/*" multiple hidden></label><label class="meta" id="cmpL" style="display:none;cursor:pointer"><input type="checkbox" id="cmp"> 사진 압축</label><button class="primary" id="post" disabled>저장</button></div>
      <div class="err" id="err"></div>
    </div>
    <div class="row" style="padding:0 16px"><span></span><button class="ghost glass" id="ord" style="font-size:13px"></button></div>
    <div id="list"><div class="status">불러오는 중…</div></div>
  </div>
</div>
</div>

<div class="modal" id="setM"><div class="box">
  <h2>폴더 설정</h2>
  <div><label class="l">이름</label><input type="text" id="sName" maxlength="60"></div>
  <div id="imgSet">
    <label class="l">아이콘 사진 (투명 배경 PNG면 게임 아이콘처럼 보여요)</label>
    <div class="pv"><img id="pvIcon" style="display:none"><label class="btn up">사진 고르기<input type="file" accept="image/*" id="fIcon" hidden></label><button class="del" id="rmIcon">지우기</button></div>
    <label class="l" style="margin-top:10px">배경 사진 (하위 폴더에도 이어져요)</label>
    <div class="pv"><img id="pvBg" class="wide" style="display:none"><label class="btn up">사진 고르기<input type="file" accept="image/*" id="fBg" hidden></label><button class="del" id="rmBg">지우기</button></div>
    <label class="l" style="margin-top:10px">배경 가리기 <span id="dimV"></span></label>
    <input type="range" id="sDim" min="0" max="90" step="5" style="width:100%">
  </div>
  <div><label class="l">포인트 색 (하위 폴더에도 이어져요)</label><div class="pv"><input type="color" id="sColor" value="#1d9bf0"><button class="del" id="rmColor">기본색</button></div></div>
  <div class="err" id="sErr"></div>
  <div class="row"><button class="del" id="sDel">폴더 삭제</button><span class="sp"></span><button class="ghost" id="sCancel">취소</button><button class="primary" id="sSave">저장</button></div>
</div></div>

<div class="modal" id="bulkM"><div class="box">
  <h2>여러 개 한 번에 만들기</h2>
  <div class="meta" id="bulkWhere"></div>
  <div><label class="l">이름으로 만들기 (한 줄에 하나)</label><textarea id="bNames" rows="5" placeholder="시로코&#10;호시노&#10;노노미"></textarea></div>
  <div><label class="l">사진으로 만들기 (사진마다 폴더가 생기고, 파일 이름이 폴더 이름이 돼요)</label><label class="btn up" id="bPickL">사진 여러 장 고르기<input type="file" accept="image/*" multiple id="bFiles" hidden></label> <span class="meta" id="bCnt"></span></div>
  <div class="err" id="bErr"></div>
  <div class="row"><span class="sp"></span><button class="ghost" id="bCancel">닫기</button><button class="primary" id="bGo">만들기</button></div>
</div></div>

<div class="modal" id="bkM"><div class="box">
  <h2>백업 · 복원</h2>
  <div class="meta">폴더, 글, 사진, 영상을 zip 파일 하나로 저장해요. 압축을 풀면 폴더별로 열어볼 수 있어요.</div>
  <button class="primary" id="bkAll">전체 백업 내려받기</button>
  <button id="bkCur" style="background:var(--card)">지금 폴더만 백업</button>
  <label class="btn up" style="text-align:center">백업 zip에서 복원<input type="file" id="rsF" accept=".zip,application/zip" hidden></label>
  <div class="meta" id="bkSt" style="min-height:20px;word-break:break-all"></div>
  <div class="row"><button class="primary" id="rsGo" style="display:none">복원 시작</button><span class="sp"></span><button class="ghost" id="bkClose">닫기</button></div>
</div></div>

<div class="modal" id="cutM"><div class="box" style="max-width:560px">
  <h2>배경 지우기</h2>
  <div class="cv"><canvas id="cvs"></canvas></div>
  <div class="meta">그림을 누르면 그 색을 배경으로 골라요 · 지금 배경색 <span id="bgSw" class="sw2"></span></div>
  <div><label class="l">지울 범위 <span id="tolV"></span></label><input type="range" id="tol" min="1" max="100" value="25" style="width:100%"></div>
  <label class="meta" style="cursor:pointer"><input type="checkbox" id="contig" checked> 바깥과 이어진 배경만 지우기</label>
  <div class="row" style="flex-wrap:wrap"><button class="ghost" id="cutNo">취소</button><span class="sp"></span><button class="ghost" id="cutOrig">원본 그대로</button><button class="primary" id="cutOk">지우고 쓰기</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let db=null,assets=null,folders=[],posts=[],files=[],ready=0,bFiles=[];
let seenP=new Set(),seenF=new Set(),curSeen='',animNext=true,expAnim='',lastBg='';
let ord='old';try{const v=localStorage.getItem('ord');ord=v?(v==='old'?'old':'new'):'old'}catch(e){}
const getCmp=()=>{try{return localStorage.getItem('cmp')!=='0'}catch(e){return true}};
let cur=(location.hash||'').slice(1),open=new Set(),draft=null,orig=null,newly=[];
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const fmt=t=>new Date(t).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ordOf=f=>typeof f.order==='number'?f.order:1e15;
const cmp=(a,b)=>ordOf(a)-ordOf(b)||a.name.localeCompare(b.name,'ko');
const byId=id=>folders.find(f=>f.id===id);
const kids=id=>folders.filter(f=>(f.parentId||'')===id).sort(cmp);
const chainOf=id=>{const a=[];let c=id;while(c){const f=byId(c);if(!f)break;a.unshift(f);c=f.parentId||''}return a};
const pathOf=id=>chainOf(id).map(f=>f.name).join(' › ')||'홈';
const inherit=k=>{const ch=chainOf(cur);for(let i=ch.length-1;i>=0;i--)if(ch[i][k])return ch[i];return null};
const IDB=(()=>{let dbp;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('archive-app',1);r.onupgradeneeded=()=>{const d=r.result;['folders','posts','blobs'].forEach(n=>d.createObjectStore(n))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode),o=t.objectStore(store);let out;const r=fn(o);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error)})};
  return{tx}})();
const mem={folders:new Map(),posts:new Map()},subs={folders:[],posts:[]},blobMap=new Map(),urls=new Map();
const notify=n=>subs[n].forEach(f=>f());
function collection(name){
  const q={order:null};
  const snap=()=>{const a=[...mem[name].values()];if(q.order)a.sort((x,y)=>q.order==='desc'?(y.createdAt||0)-(x.createdAt||0):(x.createdAt||0)-(y.createdAt||0));
    return{docs:a.map(o=>({id:o.id,data:()=>{const c={...o};delete c.id;return c}}))}};
  const api={
    orderBy(k,d){q.order=d||'asc';return api},
    onSnapshot(cb){const f=()=>cb(snap());subs[name].push(f);f();return()=>{}},
    doc(id){const put=async v=>{await IDB.tx(name,'readwrite',o=>o.put(v,id));mem[name].set(id,v);notify(name)};
      return{set:o=>put({...o,id}),update:o=>put({...(mem[name].get(id)||{}),...o,id}),
        async delete(){await IDB.tx(name,'readwrite',o=>o.delete(id));mem[name].delete(id);notify(name)}}}
  };return api}
const LocalAssets={
  async upload(b){const id=uid()+uid();await IDB.tx('blobs','readwrite',o=>o.put(b,id));blobMap.set(id,b);return{id}},
  async delete(id){await IDB.tx('blobs','readwrite',o=>o.delete(id));blobMap.delete(id);const u=urls.get(id);if(u){URL.revokeObjectURL(u);urls.delete(id)}}};
const LocalDL={async save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}};
const claude={use:async n=>n==='db'?{collection}:n==='assets'?LocalAssets:n==='downloads'?LocalDL:null};
const url=id=>{let u=urls.get(id);if(!u){const b=blobMap.get(id);if(!b)return'';u=URL.createObjectURL(b);urls.set(id,u)}return u};
async function loadAll(){
  const [fs,ps,ks,bs]=await Promise.all([IDB.tx('folders','readonly',o=>o.getAll()),IDB.tx('posts','readonly',o=>o.getAll()),IDB.tx('blobs','readonly',o=>o.getAllKeys()),IDB.tx('blobs','readonly',o=>o.getAll())]);
  fs.forEach(o=>mem.folders.set(o.id,o));ps.forEach(o=>mem.posts.set(o.id,o));ks.forEach((k,i)=>blobMap.set(k,bs[i]));
}
function go(id){cur=id||'';animNext=true;try{location.hash=cur}catch(e){}$('q').value='';document.body.classList.remove('nav');render();window.scrollTo(0,0)}
addEventListener('hashchange',()=>{cur=(location.hash||'').slice(1);animNext=true;render()});

function icon(f,cls){if(f.icon){const i=document.createElement('img');i.className=cls;i.src=url(f.icon);return i}const s=el('span',cls+' e','📁');return s}

function renderTree(){
  const t=$('tree');t.textContent='';
  const q=$('q').value.trim().toLowerCase();
  if(q){
    const fr=folders.filter(f=>f.name.toLowerCase().includes(q)),pr=posts.filter(p=>(p.text||'').toLowerCase().includes(q));
    if(!fr.length&&!pr.length)t.appendChild(el('div','status','결과가 없어요'));
    fr.forEach(f=>{const d=el('div','sr','📁 '+f.name);d.appendChild(el('small','',pathOf(f.parentId||'')));d.onclick=()=>go(f.id);t.appendChild(d)});
    pr.forEach(p=>{const tx=p.text.replace(/\s+/g,' ');const d=el('div','sr',tx.length>50?tx.slice(0,50)+'…':tx);d.appendChild(el('small','','📝 '+pathOf(p.folderId||'')));d.onclick=()=>go(p.folderId||'');t.appendChild(d)});
    return;
  }
  chainOf(cur).forEach(f=>open.add(f.id));
  const row=(f,depth,an,ix)=>{
    const has=f&&kids(f.id).length>0,id=f?f.id:'';

      const base=d+t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+'_'+pad(t.getHours())+pad(t.getMinutes())+'_'+p.id+'/';

  if($('contig').checked){const st=new Int32Array(N);let sp=0;
    const push=p=>{if(!mask[p]&&dist(p*4)<=tol){mask[p]=1;st[sp++]=p}};
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    while(sp){const p=st[--sp],x=p%w;if(x>0)push(p-1);if(x<w-1)push(p+1);if(p>=w)push(p-w);if(p<N-w)push(p+w)}
  }else for(let p=0;p<N;p++)if(dist(p*4)<=tol)mask[p]=1;
  for(let p=0;p<N;p++){
    if(mask[p]){O[p*4+3]=0;continue}
    const x=p%w;
    if((x>0&&mask[p-1])||(x<w-1&&mask[p+1])||(p>=w&&mask[p-w])||(p<N-w&&mask[p+w])){
      const f=Math.max(0,Math.min(1,(dist(p*4)-tol)/(tol*.5+8)));O[p*4+3]=Math.round(S[p*4+3]*f)}}
  cctx.putImageData(out,0,0);
}
let raf=0;const later=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(runCut)};
$('tol').oninput=later;$('contig').onchange=later;
cvs.onclick=e=>{if(!cut)return;const r=cvs.getBoundingClientRect(),x=Math.min(cut.w-1,Math.floor((e.clientX-r.left)/r.width*cut.w)),y=Math.min(cut.h-1,Math.floor((e.clientY-r.top)/r.height*cut.h)),i=(y*cut.w+x)*4,D=cut.orig.data;cut.bg=[D[i],D[i+1],D[i+2]];runCut()};
async function openCut(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){return'orig'}
  return new Promise(res=>{
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
    cvs.width=w;cvs.height=h;cctx.clearRect(0,0,w,h);cctx.drawImage(bmp,0,0,w,h);if(bmp.close)bmp.close();
    const orig=cctx.getImageData(0,0,w,h);
    const done=v=>{$('cutM').classList.remove('on');cut=null;res(v)};
    cut={orig,w,h,bg:autoBg(orig,w,h)};
    $('cutOk').onclick=()=>cvs.toBlob(b=>done(b||'orig'),'image/png');
    $('cutOrig').onclick=()=>done('orig');$('cutNo').onclick=()=>done(null);
    $('cutM').classList.add('on');runCut();
  });
}

// posting
function thumbs(){const t=$('thumbs');t.textContent='';files.forEach((f,i)=>{
  const w=el('div','th'),v=f.type.startsWith('video/');
  const m=document.createElement(v?'video':'img');m.src=URL.createObjectURL(f)+(v?'#t=0.1':'');if(v){m.muted=true;m.preload='metadata';m.playsInline=true}w.appendChild(m);
  const x=el('button','x','✕');x.onclick=()=>{files.splice(i,1);thumbs()};w.appendChild(x);
  if(!v&&/^image\/(jpeg|png|webp)$/.test(f.type)){const c=el('button','cut','✂️');c.title='배경 지우기';c.onclick=()=>editThumb(i);w.appendChild(c)}
  t.appendChild(w)})}
async function editThumb(i){const f=files[i],r=await openCut(f);if(r&&r!=='orig'){files[i]=new File([r],f.name.replace(/\.[^.]+$/,'')+'.png',{type:'image/png'});thumbs()}}
$('file').onchange=e=>{
  const all=[...e.target.files],ok=all.filter(f=>f.size<=20*1024*1024),big=all.length-ok.length;
  $('err').textContent=big?big+'개는 20MB가 넘어서 뺐어요.':'';
  files=files.concat(ok).slice(0,30);e.target.value='';thumbs()};
$('ord').onclick=()=>{ord=ord==='new'?'old':'new';try{localStorage.setItem('ord',ord)}catch(e){}renderMain()};
$('cmp').onchange=e=>{try{localStorage.setItem('cmp',e.target.checked?'1':'0')}catch(x){}};
async function shrink(f){
  if(!$('cmp').checked||!/^image\/(jpeg|png)$/.test(f.type))return f;
  try{
    const bmp=await createImageBitmap(f);
    const s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    if(s===1&&f.size<1e6){if(bmp.close)bmp.close();return f}
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const t=f.type==='image/png'?'image/png':'image/jpeg';
    const b=await new Promise(r=>c.toBlob(r,t,.85));
    return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
$('post').onclick=async()=>{
  const text=$('text').value.trim();if((!text&&!files.length)||!db)return;
  const b=$('post');b.disabled=true;b.textContent='저장 중…';$('err').textContent='';
  try{const ids=[],vids=[];for(const f of files){if(f.type.startsWith('video/')){const r=await assets.upload(f);vids.push(r.id)}else{const r=await assets.upload(await shrink(f));ids.push(r.id)}}
    await db.collection('posts').doc(uid()).set({text,images:ids,videos:vids,folderId:cur,createdAt:Date.now()});
    $('text').value='';files=[];thumbs()}
  catch(e){$('err').textContent='저장 실패: '+(e.code||e.message)}
  b.textContent='저장';b.disabled=false;
};

(async()=>{
  try{await loadAll();db={collection};assets=LocalAssets;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}catch(e){$('err').textContent='저장소를 열지 못했어요: '+(e.message||e)}
  if(!db){$('list').textContent='저장소를 사용할 수 없어요.';return}
  if(assets){$('photoBtn').style.display='';$('cmpL').style.display='';$('cmp').checked=getCmp();}else{$('bPickL').style.display='none';$('bFiles').disabled=true}
  $('post').disabled=false;
  const bad=e=>{$('err').textContent='불러오기 실패: '+(e.code||'')};
  db.collection('folders').onSnapshot(s=>{folders=s.docs.map(d=>({id:d.id,...d.data()}));ready|=1;render()},bad);
  db.collection('posts').orderBy('createdAt','desc').onSnapshot(s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));ready|=2;render()},bad);
})();
render();
</script>
